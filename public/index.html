<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zap RealTime</title>
    <style>
        /* Estilos Simples estilo WhatsApp Web */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: #d9dbd5; }
        
        /* Lateral Esquerda */
        #sidebar { width: 30%; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        #search-box { padding: 10px; background: #f6f6f6; border-bottom: 1px solid #ddd; }
        #search-input { width: 90%; padding: 8px; border-radius: 15px; border: 1px solid #ccc; outline: none; }
        #contact-list { overflow-y: auto; flex: 1; }
        .contact { padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; }
        .contact:hover { background: #f5f5f5; }
        .avatar { width: 40px; height: 40px; background: #ddd; border-radius: 50%; margin-right: 10px; }
        
        /* Área Principal */
        #main-chat { width: 70%; display: flex; flex-direction: column; background: #efe7dd; position: relative; }
        
        /* Cabeçalho da Conversa */
        #chat-header { padding: 10px 20px; background: #ededed; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .call-controls button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        #btn-call { background: #009688; }
        #btn-hangup { background: #d32f2f; display: none; }

        /* Área de Mensagens */
        #messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 8px 15px; border-radius: 10px; max-width: 60%; font-size: 14px; }
        .msg-sent { background: #dcf8c6; align-self: flex-end; }
        .msg-received { background: #fff; align-self: flex-start; }

        /* Input de Texto */
        #input-area { padding: 10px; background: #ededed; display: flex; gap: 10px; }
        #msg-input { flex: 1; padding: 10px; border-radius: 20px; border: none; outline: none; }
        #btn-send { padding: 10px 20px; border-radius: 20px; border: none; background: #009688; color: white; cursor: pointer; }

        /* Elementos de Áudio (Invisíveis) */
        audio { display: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="search-box">
            <input type="text" id="search-input" placeholder="Pesquisar número ou nome...">
        </div>
        <div id="contact-list">
            </div>
    </div>

    <div id="main-chat">
        <div id="chat-header">
            <div id="chat-title">
                <strong>Selecione um contato</strong>
                <div id="call-status" style="font-size: 12px; color: gray;">Offline</div>
            </div>
            <div class="call-controls">
                <button id="btn-call">📞 Ligar</button>
                <button id="btn-hangup">🔴 Desligar</button>
            </div>
        </div>

        <div id="messages-area"></div>

        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Digite uma mensagem...">
            <button id="btn-send">Enviar</button>
        </div>
    </div>

    <audio id="localAudio" autoplay muted></audio> <audio id="remoteAudio" autoplay></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
