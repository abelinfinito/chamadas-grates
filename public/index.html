<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANGO ZAP - O Teu Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --main-green: #00a884; --bg-gray: #f0f2f5; --white: #ffffff; }
        body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; margin: 0; height: 100vh; background: var(--bg-gray); display: flex; overflow: hidden; }

        /* NOVO DESIGN LOGIN (SEM CAIXA BRANCA) */
        #login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #00a884 0%, #005e4d 100%); display: flex; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; gap: 12px; padding: 40px; box-sizing: border-box; color: #fff; }
        #login-screen .login-brand { color: #fff; margin: 0; font-size: 1.9rem; letter-spacing: -0.5px; font-weight: 800; text-transform: uppercase; text-align: center; text-shadow: 0 6px 18px rgba(0,0,0,0.25); }
        #login-screen .login-sub { color: rgba(255,255,255,0.95); font-size: 0.95rem; margin: 0 0 6px 0; text-align: center; max-width: 340px; }
        #login-screen input#login-input { width: 320px; max-width: 92vw; padding: 12px 16px; border-radius: 28px; border: none; outline: none; font-size: 1rem; background: rgba(255,255,255,0.12); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.02); }
        #login-screen input#login-input::placeholder { color: rgba(255,255,255,0.8); }
        #login-screen .btn-entrar { width: 320px; max-width: 92vw; padding: 12px 16px; background: #25d366; color: white; border: none; border-radius: 28px; font-weight: 700; cursor: pointer; font-size: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.25); transition: transform .12s ease, box-shadow .12s ease; }
        #login-screen .btn-entrar:active { transform: translateY(1px); }
        #login-screen .btn-suporte { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 0.85rem; opacity: 0.9; margin-top: 6px; }
        @media (min-width: 900px) { #login-screen { justify-content: center; } }

        /* SIDEBAR COM BOTÃO FECHAR */
        #sidebar { 
            position: absolute; left: -320px; width: 320px; height: 100%; 
            background: var(--white); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1500; border-right: 1px solid #ddd;
        }
        #sidebar.open { left: 0; }
        .menu-header { background: #f0f2f5; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .close-menu { font-size: 30px; cursor: pointer; color: #555; line-height: 1; }

        /* CHAT HEADER */
        #main-chat { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        #chat-header { background: #ededed; padding: 12px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #ddd; }
        #hamburger { font-size: 26px; cursor: pointer; color: #555; }

        /* Typing indicator */
        #typing-indicator { display: none; padding: 6px 20px; font-size: 0.9rem; color: #666; align-items: center; gap: 8px; }
        #typing-indicator.show { display: flex; }
        .typing-dots { display: inline-flex; gap:6px; margin-left:8px; }
        .typing-dots span { width:6px; height:6px; background:#999; border-radius:50%; opacity:0.25; transform: translateY(0); animation: typing-dot 1s infinite; }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typing-dot { 0%,100% { opacity:0.25; transform: translateY(0); } 50% { opacity:1; transform: translateY(-4px); } }

        /* MENSAGENS E INPUT (Otimizados) */
        #messages { flex: 1; padding: 20px; padding-bottom: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 10px; max-width: 70%; font-size: 15px; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: #dcf8c6; }
        .received { align-self: flex-start; background: var(--white); }

        /* INPUT FIXO E CAMPO AUMENTADO */
        #input-area { padding: 14px; background: linear-gradient(180deg, rgba(255,255,255,0.6), #f0f0f0); border-top: 1px solid #e6e6e6; position: sticky; bottom: 0; z-index: 1200; box-shadow: 0 -6px 18px rgba(2,6,23,0.06); }
        #normal-input { display:flex; align-items:center; gap:12px; }
        #msg-input { flex: 1; height: 52px; padding: 12px 16px; border-radius: 14px; border: 2px solid #e6e6e6; outline: none; font-size: 16px; box-shadow: inset 0 1px 0 rgba(0,0,0,0.02); }
        #msg-input:focus { border-color: var(--main-green); box-shadow: 0 8px 30px rgba(0,168,132,0.12); }
        .btn-icon { background: #fff; border-radius: 12px; border: 1px solid #e6e6e6; width: 48px; height: 48px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor: pointer; box-shadow: 0 8px 24px rgba(2,6,23,0.06); }
        .btn-icon:hover { transform: translateY(-1px); }

        #call-modal { display: none; position: fixed; inset: 0; background: #0b141a; color: white; flex-direction: column; align-items: center; justify-content: center; z-index: 3000; }
        .anim-calling { animation: pulse 1.5s infinite; margin-bottom: 20px; color: #25d366; font-size: 1.2rem; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="login-screen" aria-label="Tela de login">
    <h1 class="login-brand">ANGO ZAP</h1>
    <p class="login-sub">Entre com o teu número para aceder ao chat.</p>
    <input type="tel" id="login-input" inputmode="numeric" pattern="[0-9]*" placeholder="Teu número (Ex: 912345678)">
    <button class="btn-entrar" onclick="tentarLogin()">ENTRAR NO CHAT</button>
    <a href="suporte.html" class="btn-suporte">Precisa de ajuda? Suporte</a>
</div>

<div id="sidebar">
    <div class="menu-header">
        <div style="display: flex; flex-direction: column;">
            <strong id="user-greeting" style="color: #000;">Olá!</strong>
            <span onclick="sair()" style="color: #ea0038; cursor: pointer; font-size: 0.8rem;">Terminar Sessão</span>
        </div>
        <div class="close-menu" onclick="toggleMenu()">&times;</div>
    </div>
    <div style="padding: 15px; font-weight: bold; color: var(--main-green); font-size: 13px;">CONTACTOS ONLINE</div>
    <div id="online-list"></div>
    <div style="padding: 15px; font-weight: bold; color: var(--main-green); font-size: 13px;">GRUPOS DA COMUNIDADE</div>
    <div id="group-list"></div>
</div>

<div id="main-chat">
    <div id="chat-header">
        <div id="hamburger" onclick="toggleMenu()">☰</div>
        <div style="flex: 1;">
            <strong id="chat-title" style="font-size: 1.1rem;">Bem-vindo ao ANGO ZAP</strong>
            <div id="chat-status" style="font-size: 12px; color: #25d366;"></div>
        </div>
        <button class="btn-icon" onclick="iniciarChamada()">📞</button>
    </div>

    <div id="typing-indicator" aria-hidden="true"><span id="typing-name"></span><span class="typing-dots"><span></span><span></span><span></span></span></div>

    <div id="messages"></div>

    <div id="input-area">
        <div id="normal-input" style="display: flex; align-items: center; gap: 10px;">
            <button class="btn-icon" onclick="iniciarGravacao()">🎙️</button>
            <input type="text" id="msg-input" placeholder="Digite aqui...">
            <button class="btn-icon" onclick="enviarTexto()">➤</button>
        </div>

        <div id="recording-ui" style="display: none; align-items: center; justify-content: space-between; background: #fff; padding: 10px 20px; border-radius: 30px; border: 1px solid #ddd;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 10px; height: 10px; background: red; border-radius: 50%; animation: pulse 1s infinite;"></div>
                <span id="voice-timer">00:00</span>
            </div>
            <div>
                <button onclick="cancelarGravacao()" style="color: #ff3b30; border: none; background: none; font-weight: bold; margin-right: 15px; cursor: pointer;">CANCELAR</button>
                <button onclick="pararEEnviar()" style="color: #00a884; border: none; background: none; font-weight: bold; cursor: pointer;">ENVIAR</button>
            </div>
        </div>
    </div>
</div>

<div id="call-modal">
    <div id="call-label" class="anim-calling">A iniciar chamada...</div>
    <div id="timer" style="font-size: 2.5rem; margin: 20px 0; display: none;">00:00</div>
    <div id="caller-name" style="font-size: 1.8rem; margin-bottom: 50px;">Nome</div>
    <div id="call-ui-btns">
        <button id="btn-answer" onclick="atender()" style="padding: 15px 45px; background: #25d366; color: white; border-radius: 35px; border: none; font-size: 1.1rem; margin: 10px; cursor: pointer;">Atender</button>
        <button onclick="desligar()" style="padding: 15px 45px; background: #ff3b30; color: white; border-radius: 35px; border: none; font-size: 1.1rem; margin: 10px; cursor: pointer;">Desligar</button>
    </div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<script src="script.js"></script>
</body>
</html>
